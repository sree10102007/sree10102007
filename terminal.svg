<svg width="700" height="560" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .term-text { font-family: 'Courier New', monospace; font-size: 14px; fill: #38bdf8; }
      .term-dim { font-family: 'Courier New', monospace; font-size: 14px; fill: #1f6feb; }
      .term-prompt { font-family: 'Courier New', monospace; font-size: 14px; fill: #38bdf8; font-weight: bold; }
    </style>
  </defs>

  <rect width="700" height="560" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect width="700" height="34" rx="10" fill="#161b22"/>
  <rect y="10" width="700" height="24" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="17" r="6" fill="#27c93f"/>
  <text x="350" y="22" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#8b949e">sree@embedded: ~</text>

  <g transform="translate(20,60)">
    <text class="term-prompt" y="0">sree@embedded ~ $ whoami</text>
    <text class="term-dim" y="22">──────────────────────────────────────────────────────────</text>
    <text class="term-text" y="44">  Role      : Embedded / Firmware Engineer</text>
    <text class="term-text" y="66">  Focus     : Automotive ECUs, Linux internals, bare-metal C</text>
    <text class="term-text" y="88">  Toolchain : ARM Cortex-M, CAN/LIN/UDS, JTAG/SWD, U-Boot</text>
    <text class="term-text" y="110">  Kernel    : Linux device drivers, kernel modules, Yocto</text>
    <text class="term-text" y="132">  Shell     : bash + tmux</text>
    <text class="term-text" y="154">  Editor    : vim</text>
    <text class="term-text" y="176">  Philosophy: Know the hardware before you abstract it</text>
    <text class="term-dim" y="198">──────────────────────────────────────────────────────────</text>

    <text class="term-prompt" y="234">sree@embedded ~ $ cat interests.txt</text>
    <text class="term-text" y="256">  ► Bare-metal &amp; RTOS firmware development</text>
    <text class="term-text" y="278">  ► Automotive protocols (CAN, LIN, UDS, AUTOSAR)</text>
    <text class="term-text" y="300">  ► Linux kernel internals &amp; device driver development</text>
    <text class="term-text" y="322">  ► Cross-compilation, bootloaders (U-Boot), Yocto/Buildroot</text>
    <text class="term-text" y="344">  ► Hardware/software co-design &amp; JTAG/SWD debugging</text>
    <text class="term-text" y="366">  ► Real-time systems, memory &amp; performance tuning</text>

    <text class="term-prompt" y="402">sree@embedded ~ $ neofetch --os</text>
    <text class="term-dim" y="424">──────────────────────────────────────────────────────────</text>
    <text class="term-text" y="446">  OS        : Arch/Gentoo Linux [btw]</text>
    <text class="term-text" y="468">  Kernel    : custom-built, patched, and debugged by hand</text>
    <text class="term-text" y="490">  Init      : systemd</text>
    <text class="term-text" y="512">  Terminal  : tmux + vim, no GUI needed</text>
    <text class="term-dim" y="534">──────────────────────────────────────────────────────────</text>

    <text class="term-prompt" y="556">sree@embedded ~ $ █
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
